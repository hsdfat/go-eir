server:
  host: 0.0.0.0
  port: 8085

database:
  host: 127.0.0.1
  port: 5433
  user: eir
  password: eir
  database: eir
  sslMode: disable

diameter:
  host: 0.0.0.0
  port: 3765
  originHost: eir.test.com
  originRealm: test.com
  productName: Go-EIR

logging:
  level: info
  format: json
  outputPath: stdout
  centralized:
    enabled: true
    backend: loki
    lokiURL: http://localhost:3100/loki/api/v1/push
    bufferSize: 1000
    flushInterval: 5
    maxBatchSize: 100
    labels:
      environment: development
      version: v1.0.0
      datacenter: local

metrics:
  enabled: true
  port: 9091
  path: /metrics
