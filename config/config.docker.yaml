# Docker configuration for EIR connecting to existing YugabyteDB
# Use with docker-compose.system.yaml

server:
  host: "0.0.0.0"
  port: 8085
  readTimeout: "30s"
  writeTimeout: "30s"
  idleTimeout: "120s"

database:
  # Connect to YugabyteDB tserver in docker-compose.system.yaml
  host: "yb-tserver"      # hostname from docker-compose
  port: 5433              # YugabyteDB YSQL port
  user: "yugabyte"        # default YugabyteDB user
  password: "yugabyte"    # default password (or empty)
  database: "eir"
  sslMode: "disable"
  maxOpenConns: 25
  maxIdleConns: 5
  connMaxLifetime: "5m"
  connMaxIdleTime: "10m"

diameter:
  host: "0.0.0.0"
  port: 3765
  originHost: "eir.docker.local"
  originRealm: "docker.local"
  productName: "Go-EIR"
  vendorID: 10415
  maxConnections: 1000
  readTimeout: "30s"
  writeTimeout: "10s"
  watchdogInterval: "30s"
  watchdogTimeout: "10s"
  maxMessageSize: 65535
  sendChannelSize: 100
  recvChannelSize: 100

cache:
  enabled: false
  provider: "redis"
  redis:
    host: "redis"
    port: 6379
    password: ""
    db: 0

logging:
  level: "info"
  format: "json"
  outputPath: "stdout"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"
